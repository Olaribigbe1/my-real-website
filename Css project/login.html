<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOXCY - Login</title>
    <link rel="stylesheet" href="login.css">
    <!-- Google Font Option -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section>
        <div class="login-container">
            
            <div class="inner-box">
                <div class="login-box">
                    <h1>🏀 LOXCY</h1>
                    <h2>Login into your Account</h2>
                    <p class="subtitle">Welcome back! Select a method to login</p>
                </div>

                
                <div class="social-buttons">
                    <button class="btn-social" type="button">
                        <img src="IMAGES/imgi_1_google.png" alt="Google Logo"> Google
                    </button>
                    <button class="btn-social" type="button">
                        <img src="IMAGES/imgi_2_facebook.png" alt="Facebook Logo"> Facebook
                    </button>
                </div>

                <div class="divider">
                    <span>.......................... or continue with Email .............................</span>
                </div>

               
                <form action="#" method="POST" class="form-content">
                    <div class="input-group">
                        <input type="email" id="email" name="email" placeholder="Enter Email" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <div class="recollect-password">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit">Login</button>
                </form>

                <p class="signup-text">
                    Don't have an account? <a href="#">Sign up!</a>
                </p>
            </div>

            
            <div class="img-login-holder">
                <img src="IMAGES/imgi_3_Login-rafiki.png" alt="Login Graphic" class="img1">
             <!-- <p class="last">© 2026 Loxcy - Themesdesign</p> -->
            </div>
        </div>
    </section>
</body>
</html>
