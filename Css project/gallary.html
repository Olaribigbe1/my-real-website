<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staggered Gallery</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

body {
  background: #f4f1ea;
  font-family: system-ui, sans-serif;
}

.container {
  max-width: 700px;
  width: 90%;
  margin: 60px auto;
  padding-inline: 4%;
}

.row {
  width: 100%;
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  border: 1px solid #1a1a1a;
  border-radius: 60px;
  width: 180px;
  padding: 9px;
  flex-shrink: 0;
}

.card.short { height: 210px; }
.card.tall  { height: 240px; }

img {
  border-radius: 60px;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}



  </style>
</head>
<body>
  <div class="container">

    <div class="row">
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card tall"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
    </div>

    <div class="row">
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card tall"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
    </div>

    <div class="row">
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card tall"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
      <div class="card short"><img src="IMG-20220610-WA0053.jpg" alt="Gallery photo"></div>
    </div>
>

  </div>
</body>
</html>
